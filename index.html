<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bootstrap.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card main rounded-4 d-flex m-auto mt-5" style="width: 18rem;">

        <div class="card-body d-flex flex-column gap-3">
            
            <div class="screen d-flex flex-column justify-content-end rounded-4">
                <div id="expr"></div>
                <input type="text" class="input" id="input1" placeholder="0">
            </div>

            <div class="dailer d-flex flex-column gap-2">

                <div class="d-flex gap-2">
                    <button class="btns sign " id="sin">sin</button>
                    <button class="btns sign " id="cos">cos</button>
                    <button class="btns sign " id="tan">tan</button>
                    <button class="btns sign">In</button>
                    <button class="btns sign">log</button>
                </div>

                <div class="d-flex gap-2">
                    <button class="btns sign" id="cubicRoot">∛</button>
                    <button class="btns sign" id="reciprocal">1/x</button>
                    <button class="btns sign" id="sqRoot">√x</button>
                    <button class="btns sign" id="square">x²</button>
                    <button class="btns sign" id="cube">x³</button>
                </div>

                <div class="d-flex gap-2">
                    <button class="btns sign" id="factorial">x!</button>
                    <button class="btns sign">(</button>
                    <button class="btns sign">)</button>
                    <button class="btns sign" id="pi">π</button>
                    <button class="btns sign" id="percentage">%</button>
                </div>

                <div class="d-flex gap-2">
                    <button class="btns num">7</button>
                    <button class="btns num">8</button>
                    <button class="btns num">9</button>
                    <button class="btns delete">DEL</button>
                    <button class="btns allClear">AC</button>
                </div>

                <div class="d-flex gap-2">
                    <button class="btns num">4</button>
                    <button class="btns num">5</button>
                    <button class="btns num">6</button>
                    <button class="btns sign">×</button>
                    <button class="btns sign">÷</button>
                </div>

                <div class="d-flex gap-2">
                    <button class="btns num">1</button>
                    <button class="btns num">2</button>
                    <button class="btns num">3</button>
                    <button class="btns sign">+</button>
                    <button class="btns sign">-</button>
                </div>

                <div class="d-flex gap-2">
                    <button class="btns num">0</button>
                    <button class="btns num">.</button>
                    <button class="btns num">00</button>
                    <button class="btns sign" id="exponent">Exp</button>
                    <button class="equals">=</button>
                </div>

            </div>

        </div>
    </div>


    <script src="app.js"></script>
</body>

</html>
